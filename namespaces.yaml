---
# IPAM namespaces. `Global` is what the fabric designs reference by name (and the blueprint's
# `foundation.namespace` default).
#
# The live snapshot also carried `MyOrg` ("MyOrg private namespace"). Deliberately NOT carried here: the
# snapshot's own README lists it among the objects that are not the reference site's to emit — a leftover
# from another deployment, not part of a generic baseline. Omitting it deletes nothing anywhere: the loader
# is update_or_create and never prunes.
- name: Global
  description: "Global routing namespace"
  deployment_types: [all]
